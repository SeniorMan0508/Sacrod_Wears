<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-List</title>
    <style>
        .hl{
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .hi{
            float: left;
            padding: 14px 16px;
            text-decoration: none;
        }

        .hi a {
            display: block;

        }
    </style>
</head>
<body>
    <!--unordered list-->
    <ul style="list-style-type: none;">
        <li>Milk</li>
        <li>Tea</li>
        <li>Coffee</li>
        <li>Milo</li>

    </ul>

    <!--Nested HTML Lists -->

    <ul>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
        <li>Milo</li>
          <ul>
              <li>black</li>
              <li>green tea</li>
              <li>ginger tea</li>

            </ul>
        <li>Milo</li>
        <li>sugar</li>
    </ul>

    <!--Horizontal List with CSS-->

    <ul class="hl">
        <li class="hi"><a class="ha" href="#">Home</a></li>
        <li class="hi"><a class="ha"href="#">About</a></li>
        <li class="hi" ><a class="ha" href="#">Services</a></li>
        <li class="hi" ><a class="ha" href="#">Contact</a></li>
    </ul>
</body>
</html>
